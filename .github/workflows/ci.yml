name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Pinned rather than macos-latest so a green run stays reproducible. Bump deliberately.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Warnings are not errors here, but they should not accumulate unnoticed either.
      - name: Fail on new warnings
        run: |
          rm -rf .build
          swift build -c release --product ChronoApp 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::The release build produced warnings"
            grep "warning:" build.log | sort -u
            exit 1
          fi

      - name: Assemble the app bundle
        run: Scripts/build-app.sh --debug

      - name: Check the bundle is well formed
        run: |
          APP=dist/Chrono.app
          test -x "$APP/Contents/MacOS/Chrono"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          # A menu bar app must not claim a Dock icon.
          test "$(defaults read "$PWD/$APP/Contents/Info" LSUIElement)" = "1"
          echo "bundle size: $(du -sh "$APP" | cut -f1)"

  ios:
    name: iOS remote
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # The generated project is committed, so it must match its generator. Catching drift here
      # is much kinder than someone discovering a stale project after adding a file.
      - name: Xcode project is in sync with its generator
        run: |
          python3 Scripts/generate-ios-project.py
          if ! git diff --quiet ios/; then
            echo "::error::ios/ is out of date — re-run Scripts/generate-ios-project.py and commit"
            git diff --stat ios/
            exit 1
          fi

      # Type-checking against the iOS SDK verifies the shared protocol files still compile for
      # iOS, without needing a simulator runtime on the runner.
      - name: Type-check the iOS sources
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0 \
            -swift-version 5 \
            ios/ChronoRemote/ChronoRemote/*.swift \
            Sources/ChronoCore/Util/Clock.swift \
            Sources/ChronoCore/Remote/RemoteProtocol.swift \
            Sources/ChronoCore/Remote/RemoteAuth.swift

      # The widget extension is compiled separately because it has its own `@main`; putting both
      # entry points in one invocation is ambiguous. It shares ChronoActivityAttributes.swift and
      # RemoteProtocol.swift with the app rather than duplicating them, so this also proves those
      # files still compile outside the app target.
      - name: Type-check the widget extension
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0 \
            -swift-version 5 \
            ios/ChronoRemote/ChronoRemoteWidget/*.swift \
            ios/ChronoRemote/ChronoRemote/ChronoActivityAttributes.swift \
            Sources/ChronoCore/Remote/RemoteProtocol.swift

      # Built for the simulator rather than a device: runners have simulator runtimes, and this
      # additionally exercises the asset catalog, which a device build on a machine without a
      # simulator runtime cannot (actool needs one even for a device build).
      - name: Build the app
        run: |
          xcodebuild -project ios/ChronoRemote/ChronoRemote.xcodeproj \
            -scheme ChronoRemote \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The extension has to be *embedded*, not merely built. A widget target that compiles but
      # never gets copied into the app produces no Live Activity and no error either, which is
      # exactly the kind of failure nobody notices until someone locks their phone.
      - name: Widget extension is embedded in the app
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 3 -name 'ChronoRemote.app' | head -1)
          test -n "$APP" || { echo "::error::no built app found"; exit 1; }
          APPEX="$APP/PlugIns/ChronoRemoteWidget.appex"
          test -d "$APPEX" || { echo "::error::widget extension was not embedded"; ls -R "$APP" | head -40; exit 1; }
          # And that it declares itself a WidgetKit extension, or it loads as nothing.
          POINT=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Info.plist")
          echo "extension point: $POINT"
          test "$POINT" = "com.apple.widgetkit-extension"
          echo "embedded: $(du -sh "$APPEX" | cut -f1)"

  docs:
    name: Docs and hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: No secrets committed
        run: |
          # Cheap, high-value guard. Jira Cloud tokens start ATATT; 1Password references are
          # fine (they are pointers, not secrets), so they are excluded.
          if grep -rInE 'ATATT[A-Za-z0-9_-]{20,}' --exclude-dir=.git . ; then
            echo "::error::What looks like a Jira API token is committed"
            exit 1
          fi
          if grep -rIn 'BEGIN [A-Z ]*PRIVATE KEY' --exclude-dir=.git . ; then
            echo "::error::A private key is committed"
            exit 1
          fi
          echo "clean"

      - name: Internal doc links resolve
        run: python3 Scripts/check-doc-links.py --ci
